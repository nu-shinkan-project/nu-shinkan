name: ナイトリーチェック
on:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/use-repo
      - name: ワークフローツールの型チェック
        run: pnpm --filter @repo/tools exec tsc --noEmit
      - name: Playwrightブラウザのキャッシュ
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: 全workspaceのチェック
        id: checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm checking run
      - name: UIテストレポートの保存
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: ./.github/actions/ui-test
      - name: チェック結果の保存
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: checking-result
          path: .artifacts/checking-result.json
          if-no-files-found: ignore

      - name: 成功したタスクのキャッシュ保存
        if: ${{ always() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.cache-key }}
