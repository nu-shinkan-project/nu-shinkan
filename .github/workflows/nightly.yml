name: ナイトリーチェック
on:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/use-repo
      - name: ワークフローツールの型チェック
        run: pnpm --filter @repo/tools exec tsc --noEmit
      - uses: ./.github/actions/vi-test
      - uses: ./.github/actions/ui-test
