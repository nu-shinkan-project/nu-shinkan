name: ナイトリーチェック
on:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/use-repo
      - name: ワークフローツールの型チェック
        run: pnpm --filter @repo/tools exec tsc --noEmit
      - uses: ./.github/actions/vi-test
      - uses: ./.github/actions/ui-test

      - name: 成功したタスクのキャッシュ保存
        if: ${{ always() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.cache-key }}
