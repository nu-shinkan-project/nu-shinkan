name: 差分更新デプロイ
on:
  push:
    tags: [staging, release]
permissions:
  contents: read
jobs:
  update-deploy:
    if: ${{ !github.event.deleted }}
    uses: ./.github/workflows/deploy.run.yml
    secrets: inherit
    with:
      entry: update
      channel: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      base: ${{ github.event.before || '' }}
