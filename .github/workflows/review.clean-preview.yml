name: プレビューWorkersのクリーンアップ
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: プレビューWorkerを削除するPR番号
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  receive:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.request.outputs.pr }}
      commit: ${{ steps.request.outputs.commit }}
    steps:
      - name: 受付時の入力確認
        id: request
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) throw Error('Invalid PR number');
            // Existence is checked at reception; state is not rechecked before deletion.
            if (context.eventName === 'workflow_dispatch') await github.rest.pulls.get({...context.repo,pull_number:number});
            const {data} = await github.rest.repos.getCommit({...context.repo,ref:context.payload.repository.default_branch});
            core.setOutput('pr', String(number));
            core.setOutput('commit', data.sha);
            core.info(`[receive] Cleanup PR ${number}; default-branch commit=${data.sha}`);
  cleanup:
    needs: receive
    uses: ./.github/workflows/deploy.run.yml
    secrets: inherit
    with:
      entry: cleanup
      channel: preview
      commit: ${{ needs.receive.outputs.commit }}
      pr: ${{ needs.receive.outputs.pr }}
