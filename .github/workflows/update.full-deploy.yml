name: Full Deploy
on:
  workflow_dispatch:
    inputs:
      channel:
        description: タグを移動せず全件反映する環境
        type: choice
        options: [staging, release]
        required: true
permissions:
  contents: read
jobs:
  receive:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.request.outputs.commit }}
    steps:
      - name: 受付時のタグをcommit SHAに固定
        id: request
        uses: actions/github-script@v9
        env:
          CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const channel = process.env.CHANNEL;
            if (!['staging','release'].includes(channel)) throw Error('Invalid channel');
            const {data} = await github.rest.repos.getCommit({...context.repo, ref:`refs/tags/${channel}`});
            if (!/^[a-f0-9]{40}$/.test(data.sha)) throw Error('Invalid resolved commit');
            core.setOutput('commit', data.sha);
            core.info(`[receive] Full ${channel}: fixed commit=${data.sha}; tag remains unchanged.`);
      - name: 受付失敗の通知
        if: ${{ always() && steps.request.outcome != 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await core.summary.addRaw(`Full deployment request failed before checkout. No CLI report is available. Check the tag and permissions, then rerun Full Deploy. [Run logs](${url})`).write();
  full-deploy:
    needs: receive
    uses: ./.github/workflows/deploy.run.yml
    secrets: inherit
    with:
      entry: full
      channel: ${{ inputs.channel }}
      commit: ${{ needs.receive.outputs.commit }}
