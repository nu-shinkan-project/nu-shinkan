name: リポジトリセットアップ
description: ワークフローでパッケージ依存関係を使用するためのセットアップ手順を定義します。

inputs:
  context:
    description: Turboキャッシュ用のキャッシュキー。既定値はトリガーイベントのコミットハッシュ。
    required: false
    default: ${{ github.sha }}

runs:
  using: "composite"
  steps:
    - if: env.REPO_SETUP_DONE != 'true'
      uses: pnpm/action-setup@v6.1.0

    - if: env.REPO_SETUP_DONE != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Turboキャッシュの準備
      if: env.REPO_SETUP_DONE != 'true'
      uses: actions/cache@v6
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ inputs.context || github.sha }}

    - name: 標準依存関係のインストール
      shell: bash
      env:
        HUSKY: 0
      run: |
        pnpm clean
        pnpm install --frozen-lockfile --prefer-offline --filter=.
        pnpm turbo run bootstrap
        pnpm install --frozen-lockfile --prefer-offline --filter=@repo/tools...

    - name: セットアップ完了フラグの設定
      if: env.REPO_SETUP_DONE != 'true'
      shell: bash
      run: echo "REPO_SETUP_DONE=true" >> "$GITHUB_ENV"
