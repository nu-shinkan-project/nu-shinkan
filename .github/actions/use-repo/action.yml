name: リポジトリセットアップ
description: 用途に必要な依存関係を準備し、デプロイではTurboキャッシュを復元します。
inputs:
  context:
    description: PRまたはchannel単位のキャッシュ名前空間
    required: true
  dependencies:
    description: fullは全workspace、cleanupはルートの実行ツールだけを準備する
    default: full
  cache:
    description: falseの場合はTurboキャッシュを復元しない
    default: "true"
outputs:
  cache-key:
    description: このrun専用の保存キー
    value: turbo-${{ runner.os }}-${{ inputs.context }}-${{ github.run_id }}-${{ github.run_attempt }}
runs:
  using: composite
  steps:
    - name: キャッシュ区分の確認
      shell: bash
      env:
        CACHE_CONTEXT: ${{ inputs.context }}
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        if [[ -z "$CACHE_CONTEXT" ]]; then
          echo '::error::use-repo requires an explicit cache context.'
          exit 1
        fi
        if [[ "$DEPENDENCIES" != full && "$DEPENDENCIES" != cleanup ]]; then
          echo '::error::Expected full or cleanup dependency preparation.'
          exit 1
        fi
    - uses: ./.github/actions/use-node
    - name: Turboキャッシュの復元（失敗時は通常実行）
      if: inputs.cache == 'true'
      id: restore
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.context }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.context }}-
    - name: キャッシュ状態
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.cache }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_OUTCOME: ${{ steps.restore.outcome }}
      run: |
        if [[ "$CACHE_ENABLED" != true ]]; then
          echo '[setup] Turbo cache disabled for this event; no cross-ref sharing workaround is used.'
        else
          echo "[setup] Turbo cache restore: $CACHE_OUTCOME; exact hit: ${CACHE_HIT:-false}"
        fi
    - name: 全workspaceの依存関係と設定ツールの準備
      if: inputs.dependencies == 'full'
      shell: bash
      env:
        HUSKY: "0"
      run: |
        echo '[setup] Installing dependencies for sync, checks, configuration, build and deployment.'
        pnpm install --frozen-lockfile --prefer-offline
        pnpm --filter @repo/app-config build
        echo '[setup] Dependencies and app-config are ready.'
    - name: cleanup実行ツールの準備
      if: inputs.dependencies == 'cleanup'
      shell: bash
      env:
        HUSKY: "0"
      run: |
        echo '[setup] Installing root execution tools for cleanup; install scripts are disabled.'
        pnpm install --filter nu-shinkan --frozen-lockfile --prefer-offline --ignore-scripts
        echo '[setup] Cleanup tools are ready; app-config build is not required.'
