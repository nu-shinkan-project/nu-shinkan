name: UIテストレポートのアップロード
description: tools/checkingが収集したレポートをGitHub artifactへ保存します。
inputs:
  artifact_name:
    description: アップロードするアーティファクトの名前
    default: ui_test-reports
outputs:
  artifact_url:
    description: UIテストレポートのダウンロードリンク
    value: ${{ steps.upload.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: .artifacts/ui_test-reports/
        if-no-files-found: ignore
